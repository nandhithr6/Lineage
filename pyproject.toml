[project]
name = "lineage"
version = "0.1.0"
description = "Lineage: a company brain that knows when its knowledge is out of date (Kubernetes, FalkorDB)"
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.8.0",
    "fastapi>=0.143.1",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
