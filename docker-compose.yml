# One command, everything on one port:   docker compose up --build        then open http://localhost:7860
#
# One container (Dockerfile.single): FalkorDB (inside, localhost only) + loader + drift detector + API + MCP server + the built web UI + the local embedding model.
# The committed snapshot is loaded into the in-container graph at every start (about 15 seconds), so nothing needs to persist and there is no database password to set.
# Without any key in .env the saved answers, findings, trace, Explore, Insights, What changed, text search and the MCP tools all work; add GEMINI_API_KEY (and optionally
# GROQ_API_KEY) to .env for free-form questions. First build takes several minutes (it downloads the 210 MB embedding model); later starts reuse the image.
# Smaller image without the embedding model (about 750 MB, 150 MB of RAM): docker build -f Dockerfile.slim -t lineage-slim .   (see docs/deploy.md)
# For a server with a persistent graph volume use docker-compose.stack.yml.

services:
  lineage:
    build:
      context: .
      dockerfile: Dockerfile.single
    image: lineage-single
    ports:
      - "127.0.0.1:${PORT:-7860}:7860"   # local only; use scripts/share_demo.sh for a temporary public link
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_MIN_INTERVAL: ${LLM_MIN_INTERVAL:-5}
      ASK_PER_IP_PER_HOUR: ${ASK_PER_IP_PER_HOUR:-12}
      ASK_PER_DAY: ${ASK_PER_DAY:-150}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 90s
    restart: unless-stopped
