text x="50" y="543" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >Also: Person APPROVER_OF / REVIEWER_OF CodePath (with valid_from, valid_to), SIG OWNS CodePath, CodePath CHILD_OF CodePath (folder tree),</text><text x="50" y="565" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >Person MEMBER_OF Team, and Chunk CHUNK_OF DocSection or KEP (the text and vectors behind search).</text></svg>