<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" role="img" aria-label="Bar chart: Lineage 97% vs 64% and 61% on 36 draft questions; 53% vs 33% and 40% on 15 independent questions; 93% after fixes on the same 15 questions" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Bar chart: Lineage 97% vs 64% and 61% on 36 draft questions; 53% vs 33% and 40% on 15 independent questions; 93% after fixes on the same 15 questions</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97ad"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5bea"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172033" flood-opacity="0.10"/></filter></defs><rect width="1180" height="600" fill="#ffffff"/><text x="40" y="48" font-size="26" fill="#172033" font-weight="700" text-anchor="start" >Graph tools beat plain retrieval, and the honest number is lower</text><text x="40" y="76" font-size="15" fill="#5f6b7e" font-weight="400" text-anchor="start" >Same model and same text for every system. Share of answers judged correct.</text><rect x="40" y="98" width="16" height="16" rx="4" fill="#2a78d6"/><text x="64" y="111" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >Lineage (graph tools)</text><rect x="262.2" y="98" width="16" height="16" rx="4" fill="#eb6834"/><text x="286.2" y="111" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >Plain keyword retrieval</text><rect x="500.79999999999995" y="98" width="16" height="16" rx="4" fill="#1baf7a"/><text x="524.8" y="111" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >Plain vector retrieval</text><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><rect width="4" height="8" fill="#2a78d6"/></pattern></defs><rect x="731.1999999999999" y="98" width="16" height="16" rx="4" fill="url(#hatch)" stroke="#2a78d6" stroke-width="1.5"/><text x="755.1999999999999" y="111" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >Lineage after fixes (same questions)</text><line x1="90" y1="470.0" x2="1130" y2="470.0" stroke="#e8ecf3" stroke-width="1"/><text x="78" y="474.0" font-size="12" fill="#5f6b7e" font-weight="400" text-anchor="end" >0%</text><line x1="90" y1="392.5" x2="1130" y2="392.5" stroke="#e8ecf3" stroke-width="1"/><text x="78" y="396.5" font-size="12" fill="#5f6b7e" font-weight="400" text-anchor="end" >25%</text><line x1="90" y1="315.0" x2="1130" y2="315.0" stroke="#e8ecf3" stroke-width="1"/><text x="78" y="319.0" font-size="12" fill="#5f6b7e" font-weight="400" text-anchor="end" >50%</text><line x1="90" y1="237.5" x2="1130" y2="237.5" stroke="#e8ecf3" stroke-width="1"/><text x="78" y="241.5" font-size="12" fill="#5f6b7e" font-weight="400" text-anchor="end" >75%</text><line x1="90" y1="160.0" x2="1130" y2="160.0" stroke="#e8ecf3" stroke-width="1"/><text x="78" y="164.0" font-size="12" fill="#5f6b7e" font-weight="400" text-anchor="end" >100%</text><path d="M150 470 L150 172.68 Q150 168.68 154 168.68 L224 168.68 Q228 168.68 228 172.68 L228 470 Z" fill="#2a78d6"/><text x="189.0" y="144.68" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >97%</text><text x="189.0" y="161.68" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >35/36</text><path d="M242 470 L242 275.90999999999997 Q242 271.90999999999997 246 271.90999999999997 L316 271.90999999999997 Q320 271.90999999999997 320 275.90999999999997 L320 470 Z" fill="#eb6834"/><text x="281.0" y="247.90999999999997" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >64%</text><text x="281.0" y="264.90999999999997" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >23/36</text><path d="M334 470 L334 284.59000000000003 Q334 280.59000000000003 338 280.59000000000003 L408 280.59000000000003 Q412 280.59000000000003 412 284.59000000000003 L412 470 Z" fill="#1baf7a"/><text x="373.0" y="256.59000000000003" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >61%</text><text x="373.0" y="273.59000000000003" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >22/36</text><text x="281.0" y="500" font-size="16" fill="#172033" font-weight="700" text-anchor="middle" >Our 36 draft questions</text><text x="281.0" y="520" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="middle" >revised after we saw early runs</text><path d="M550 470 L550 308.77 Q550 304.77 554 304.77 L624 304.77 Q628 304.77 628 308.77 L628 470 Z" fill="#2a78d6"/><text x="589.0" y="280.77" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >53%</text><text x="589.0" y="297.77" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >8/15</text><path d="M642 470 L642 370.77 Q642 366.77 646 366.77 L716 366.77 Q720 366.77 720 370.77 L720 470 Z" fill="#eb6834"/><text x="681.0" y="342.77" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >33%</text><text x="681.0" y="359.77" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >5/15</text><path d="M734 470 L734 350.0 Q734 346.0 738 346.0 L808 346.0 Q812 346.0 812 350.0 L812 470 Z" fill="#1baf7a"/><text x="773.0" y="322.0" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >40%</text><text x="773.0" y="339.0" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >6/15</text><path d="M850 470 L850 184.76999999999998 Q850 180.76999999999998 854 180.76999999999998 L924 180.76999999999998 Q928 180.76999999999998 928 184.76999999999998 L928 470 Z" fill="url(#hatch)" stroke="#2a78d6" stroke-width="2"/><text x="889.0" y="156.76999999999998" font-size="18" fill="#172033" font-weight="800" text-anchor="middle" >93%</text><text x="889.0" y="173.76999999999998" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >14/15</text><text x="739.0" y="500" font-size="16" fill="#172033" font-weight="700" text-anchor="middle" >15 independent questions</text><text x="739.0" y="520" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="middle" >written by the team, run once</text><line x1="90" y1="470" x2="1130" y2="470" stroke="#9aa6ba" stroke-width="1.5"/><text x="40" y="556" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >The hatched bar re-ran the SAME 15 questions after fixing the gaps they exposed, so it is not a held-out result. The solid bars are the fair comparison.</text><text x="40" y="576" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >Answers were judged by a language model against free-text gold answers (not yet fully human-checked). 36 and 15 questions are small samples; one run varies by about one question.</text></svg>