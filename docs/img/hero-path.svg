<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="A docs badge followed through the graph from claim to verified history, design decision and owning team" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>A docs badge followed through the graph from claim to verified history, design decision and owning team</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97ad"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5bea"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172033" flood-opacity="0.10"/></filter></defs><rect width="1200" height="500" fill="#ffffff"/><text x="40" y="52" font-size="26" fill="#172033" font-weight="700" text-anchor="start" >One badge, followed through the graph</text><text x="40" y="80" font-size="15" fill="#5f6b7e" font-weight="400" text-anchor="start" >Every arrow below is a real relationship in FalkorDB, and each one carries a link to its source at a pinned commit.</text><rect x="30" y="118" width="212" height="118" rx="14" fill="#ffffff" stroke="#8b95a5" stroke-width="1.5" filter="url(#sh)"/><text x="46" y="146" font-size="11" fill="#5f6b7e" font-weight="700" text-anchor="start" letter-spacing="1">DOCS SECTION</text><text x="46" y="174" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Quota for local</text><text x="46" y="196" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >ephemeral storage</text><text x="46" y="220" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >Resource Quotas page</text><rect x="330" y="118" width="212" height="118" rx="14" fill="#fffaf0" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/><text x="346" y="146" font-size="11" fill="#d97706" font-weight="700" text-anchor="start" letter-spacing="1">CLAIM ON THE PAGE</text><text x="346" y="184" font-size="24" fill="#dc2626" font-weight="800" text-anchor="start" >Alpha since v1.8</text><text x="346" y="214" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >hand-typed badge</text><rect x="630" y="118" width="212" height="118" rx="14" fill="#f3f7ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/><text x="646" y="146" font-size="11" fill="#2563eb" font-weight="700" text-anchor="start" letter-spacing="1">FEATURE GATE</text><text x="646" y="178" font-size="18" fill="#172033" font-weight="700" text-anchor="start" >LocalStorage</text><text x="646" y="200" font-size="18" fill="#172033" font-weight="700" text-anchor="start" >CapacityIsolation</text><text x="646" y="224" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >linked at 84% confidence</text><rect x="930" y="118" width="240" height="118" rx="14" fill="#f2fbf5" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/><text x="946" y="146" font-size="11" fill="#16a34a" font-weight="700" text-anchor="start" letter-spacing="1">STAGE IN EVERY RELEASE</text><rect x="938.0" y="163" width="108" height="26" rx="13" fill="#d97706"/><text x="992" y="181" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" >alpha 1.7-1.9</text><rect x="1052.0" y="163" width="112" height="26" rx="13" fill="#2563eb"/><text x="1108" y="181" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" >beta 1.10-1.24</text><rect x="940.0" y="197" width="128" height="26" rx="13" fill="#16a34a"/><text x="1004" y="215" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" >stable 1.25-1.26</text><rect x="1082.0" y="197" width="76" height="26" rx="13" fill="#6b7280"/><text x="1120" y="215" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle" >removed</text><path d="M246 177.0 L326 177.0" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><text x="301" y="165.0" font-size="11" fill="#5f6b7e" font-weight="600" text-anchor="middle" >HAS_CLAIM</text><path d="M546 177.0 L626 177.0" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><text x="601" y="165.0" font-size="11" fill="#5f6b7e" font-weight="600" text-anchor="middle" >ABOUT</text><path d="M846 177.0 L926 177.0" fill="none" stroke="#2f5bea" stroke-width="3" marker-end="url(#arb)"/><text x="901" y="165.0" font-size="11" fill="#2f5bea" font-weight="700" text-anchor="middle" >STAGE_IN</text><rect x="630" y="318" width="212" height="104" rx="14" fill="#faf7ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/><text x="646" y="346" font-size="11" fill="#7c3aed" font-weight="700" text-anchor="start" letter-spacing="1">DESIGN DECISION (KEP 361)</text><text x="646" y="376" font-size="16" fill="#172033" font-weight="700" text-anchor="start" >Local Ephemeral Storage</text><text x="646" y="398" font-size="16" fill="#172033" font-weight="700" text-anchor="start" >Capacity Isolation</text><rect x="930" y="318" width="240" height="104" rx="14" fill="#fff7fb" stroke="#be185d" stroke-width="1.5" filter="url(#sh)"/><text x="946" y="346" font-size="11" fill="#be185d" font-weight="700" text-anchor="start" letter-spacing="1">TEAM</text><text x="946" y="384" font-size="22" fill="#172033" font-weight="800" text-anchor="start" >sig-storage</text><text x="946" y="408" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >owns the decision</text><path d="M736.0 318 L736.0 236" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><rect x="750.0" y="266.0" width="84.0" height="20" rx="5" fill="#ffffff" opacity="0.95"/><text x="792.0" y="281.0" font-size="12" fill="#5f6b7e" font-weight="600" text-anchor="middle" >INTRODUCES</text><path d="M846 370 L926 370" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><text x="901" y="358" font-size="11" fill="#5f6b7e" font-weight="600" text-anchor="middle" >OWNED_BY</text><rect x="30" y="318" width="560" height="104" rx="14" fill="#f8fafc" stroke="#e7ebf2" stroke-width="1.5" /><text x="50" y="346" font-size="11" fill="#5f6b7e" font-weight="700" text-anchor="start" letter-spacing="1">WHAT LINEAGE CONCLUDES</text><rect x="30.0" y="371" width="200" height="26" rx="13" fill="#dc2626"/><text x="130" y="389" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle" >Docs say: Alpha since v1.8</text><text x="248" y="389" font-size="15" fill="#5f6b7e" font-weight="600" text-anchor="start" >but</text><rect x="295.0" y="371" width="270" height="26" rx="13" fill="#16a34a"/><text x="430" y="389" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle" >Verified: Stable since 1.25, gate removed</text><text x="40" y="470" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >It ruled out three look-alike gates whose first stage starts after v1.8 (1.15, 1.16 and 1.32), so the badge can only be about this one.</text></svg>