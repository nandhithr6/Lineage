<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Architecture: sources, ingest, link, FalkorDB graph, detector and agent tools, API, web UI and MCP" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title>Architecture: sources, ingest, link, FalkorDB graph, detector and agent tools, API, web UI and MCP</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97ad"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f5bea"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172033" flood-opacity="0.10"/></filter></defs><rect width="1200" height="420" fill="#ffffff"/><text x="40" y="50" font-size="26" fill="#172033" font-weight="700" text-anchor="start" >How the pieces fit</text><text x="40" y="78" font-size="15" fill="#5f6b7e" font-weight="400" text-anchor="start" >Everything the product answers is a query to FalkorDB. Remove it and nothing works.</text><rect x="30" y="120" width="195" height="100" rx="14" fill="#ffffff" stroke="#8b95a5" stroke-width="1.5" filter="url(#sh)"/><text x="46" y="150" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Public sources</text><text x="46" y="176" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >4 Kubernetes repos +</text><text x="46" y="196" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >GitHub API</text><rect x="255" y="120" width="195" height="100" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" filter="url(#sh)"/><text x="271" y="150" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Ingest</text><text x="271" y="176" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >parsers write small</text><text x="271" y="196" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >JSONL snapshots</text><rect x="480" y="120" width="195" height="100" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/><text x="496" y="150" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >Link</text><text x="496" y="176" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >badge to feature gate,</text><text x="496" y="196" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >with a confidence</text><rect x="705" y="100" width="240" height="140" rx="14" fill="#eef3ff" stroke="#2f5bea" stroke-width="3" filter="url(#sh)"/><text x="825" y="138" font-size="24" fill="#2f5bea" font-weight="800" text-anchor="middle" >FalkorDB</text><text x="825" y="166" font-size="15" fill="#172033" font-weight="600" text-anchor="middle" >the graph</text><text x="825" y="190" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="middle" >traversals, PageRank, paths, vectors</text><text x="825" y="214" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="middle" >rebuilt from the snapshot with MERGE</text><path d="M225 170 L255 170" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><path d="M450 170 L480 170" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><path d="M675 170 L705 170" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><rect x="990" y="100" width="190" height="60" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/><text x="1006" y="126" font-size="16" fill="#172033" font-weight="700" text-anchor="start" >Detector</text><text x="1006" y="146" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >writes Findings</text><rect x="990" y="180" width="190" height="60" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/><text x="1006" y="206" font-size="16" fill="#172033" font-weight="700" text-anchor="start" >Agent tools</text><text x="1006" y="226" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >read-only Cypher</text><path d="M945 150 Q970 128 990 130" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><path d="M945 190 Q970 212 990 210" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><rect x="705" y="300" width="240" height="80" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" filter="url(#sh)"/><text x="721" y="330" font-size="17" fill="#172033" font-weight="700" text-anchor="start" >FastAPI</text><text x="721" y="354" font-size="13" fill="#5f6b7e" font-weight="400" text-anchor="start" >evidence + path + trace</text><path d="M825 240 L825 300" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><rect x="990" y="300" width="190" height="36" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" /><text x="1006" y="324" font-size="14" fill="#172033" font-weight="700" text-anchor="start" >Web UI (React)</text><rect x="990" y="344" width="190" height="36" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" /><text x="1006" y="368" font-size="14" fill="#172033" font-weight="700" text-anchor="start" >MCP server (11 tools)</text><path d="M945 340 L990 322" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><path d="M945 345 L990 362" fill="none" stroke="#8a97ad" stroke-width="1.8" marker-end="url(#ar)"/><text x="40" y="330" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >Every edge stores: source_url (pinned to a commit), extracted_by,</text><text x="40" y="352" font-size="14" fill="#5f6b7e" font-weight="400" text-anchor="start" >confidence, recorded_at, and valid_from / valid_to when it can change.</text></svg>